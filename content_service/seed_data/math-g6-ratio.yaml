id: math-g6-ratio
title_khmer: គណិតវិទ្យា ថ្នាក់ទី៦៖ ផលធៀប និងសមាមាត្រ
title_eng: 'Math Grade 6: Ratios and Proportions'
grade: 6
subject: math
problem_statement_khmer: 'ក្នុងថ្នាក់រៀនមួយ មានសិស្សប្រុស ១២ នាក់ និងសិស្សស្រី ១៨ នាក់។ តើផលធៀបសិស្សប្រុសទៅសិស្សស្រីក្នុងទម្រង់សម្រួលបំផុតស្មើនឹងប៉ុន្មាន?'
problem_statement_eng: 'In a classroom, there are 12 boys and 18 girls. What is the ratio of boys to girls in simplest form?'
image_uri: https://images.unsplash.com/photo-1509062522246-3755977927d7?w=600&auto=format&fit=crop&q=80
steps:
- id: rat-step-1
  step_number: 1
  total_steps: 2
  question_khmer: 'តើផលធៀបដំបូងរវាងសិស្សប្រុស (១២) ទៅសិស្សស្រី (១៨) សរសេរយ៉ាងដូចម្តេច?'
  question_eng: 'How is the initial ratio of boys (12) to girls (18) written?'
  input_format: mcq
  options:
  - '12 : 18'
  - '18 : 12'
  - '12 : 30'
  correct_answer: '12 : 18'
  hint1:
    khmer: 'ផលធៀបសិស្សប្រុសទៅសិស្សស្រី គឺយកចំនួនសិស្សប្រុសមុន ហើយសិស្សស្រីបន្ទាប់។'
    eng: 'Ratio of boys to girls means boys number first, then girls number.'
  hint2:
    khmer: 'សិស្សប្រុស ១២ នាក់ និងសិស្សស្រី ១៨ នាក់ គឺ ១២ : ១៨!'
    eng: '12 boys and 18 girls is written as 12 : 18!'
  hint3:
    title_khmer: សញ្ញាផលធៀប
    title_eng: Ratio Notation
    example_khmer: '12 : 18'
    example_eng: '12 : 18'
  explain_differently:
    simple_khmer: 'លំដាប់ថ្នាក់ពិតជាសំខាន់ ព្រោះសំណួរចង់បានសិស្សប្រុសទៅសិស្សស្រី។'
    simple_eng: 'Order matters: boys come first, girls come second.'
    analogy_title: 'លំដាប់រៀបចំ (Order)'
    analogy_khmer: 'ប្រុស : ស្រី = ១២ : ១៨'
    analogy_eng: 'Boys : Girls = 12 : 18'
    analogy_type: apples
- id: rat-step-2
  step_number: 2
  total_steps: 2
  question_khmer: 'សម្រួលផលធៀប ១២ : ១៨ ដោយចែកនឹងតួចែករួមធំបំផុត (៦)។ តើទទួលបានផលធៀបប៉ុន្មាន?'
  question_eng: 'Simplify the ratio 12 : 18 by dividing by the greatest common divisor (6). What is the simplified ratio?'
  input_format: mcq
  options:
  - '2 : 3'
  - '3 : 2'
  - '1 : 2'
  correct_answer: '2 : 3'
  hint1:
    khmer: '១២ ÷ ៦ = ២ និង ១៨ ÷ ៦ = ៣។'
    eng: '12 ÷ 6 = 2 and 18 ÷ 6 = 3.'
  hint2:
    khmer: 'ផលធៀបសម្រួលរួចគឺ ២ : ៣!'
    eng: 'The simplified ratio is 2 : 3!'
  hint3:
    title_khmer: ការសម្រួលផលធៀប
    title_eng: Simplified Ratio
    example_khmer: '12:18 ÷ 6 = 2:3'
    example_eng: '12:18 ÷ 6 = 2:3'
  explain_differently:
    simple_khmer: 'សម្រាប់សិស្សប្រុសរៀងរាល់ ២ នាក់ គឺមានសិស្សស្រី ៣ នាក់។'
    simple_eng: 'For every 2 boys, there are 3 girls in the class.'
    analogy_title: 'ក្រុមតូចៗ (Equal Groups)'
    analogy_khmer: '២ : ៣ (2 to 3)'
    analogy_eng: '2 : 3 ratio'
    analogy_type: apples
