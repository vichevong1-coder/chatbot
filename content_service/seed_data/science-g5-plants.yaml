id: science-g5-plants
title_khmer: វិទ្យាសាស្ត្រ ថ្នាក់ទី៥៖ រស្មីសំយោគរបស់រុក្ខជាតិ
title_eng: 'Science Grade 5: Plant Photosynthesis'
grade: 5
subject: science
problem_statement_khmer: រុក្ខជាតិបៃតងផលិតអាហារផ្ទាល់ខ្លួនដោយប្រើប្រាស់ពន្លឺព្រះអាទិត្យ ទឹក និងឧស្ម័នកាបូនិច។ តើដំណើរការនេះហៅថាអ្វី?
problem_statement_eng: Green plants make their own food using sunlight, water, and carbon dioxide. What is this process called?
image_uri: https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=600&auto=format&fit=crop&q=80
steps:
- id: plt-step-1
  step_number: 1
  total_steps: 2
  question_khmer: តើដំណើរការផលិតអាហាររបស់រុក្ខជាតិដោយប្រើពន្លឺព្រះអាទិត្យហៅថាអ្វី?
  question_eng: What is the process where green plants make food using sunlight called?
  input_format: mcq
  options:
  - រស្មីសំយោគ (Photosynthesis)
  - ការដកដង្ហើម (Respiration)
  - ការរលាយ (Melting)
  correct_answer: រស្មីសំយោគ (Photosynthesis)
  hint1:
    khmer: ពាក្យនេះមានន័យថាការផ្សំអាហារដោយប្រើពន្លឺ។
    eng: The word means building food using light.
  hint2:
    khmer: ដំណើរការនេះគឺ "រស្មីសំយោគ" (Photosynthesis)!
    eng: Green plants make food through "Photosynthesis"!
  hint3:
    title_khmer: ពាក្យគន្លឹះរុក្ខជាតិ
    title_eng: Plant Keyword
    example_khmer: ពន្លឺ + ទឹក + កាបូនិច = រស្មីសំយោគ
    example_eng: Light + Water + CO2 = Photosynthesis
  explain_differently:
    simple_khmer: រស្មីសំយោគជួយឲ្យរុក្ខជាតិលូតលាស់ និងបង្កើតឧស្ម័នអុកស៊ីសែនសម្រាប់យើងដកដង្ហើម។
    simple_eng: Photosynthesis helps plants grow and creates oxygen for us to breathe.
    analogy_title: ផ្ទះបាយធម្មជាតិ (Nature's Kitchen)
    analogy_khmer: ដូចជាស្លឹកឈើជាផ្ទះបាយចម្អិនអាហារ។
    analogy_eng: The leaf acts like a kitchen cooking food with sunlight.
    analogy_type: plants
- id: plt-step-2
  step_number: 2
  total_steps: 2
  question_khmer: តើឧស្ម័នអ្វីដែលរុក្ខជាតិបញ្ចេញមកក្រៅបន្ទាប់ពីរស្មីសំយោគ ដែលមនុស្សនិងសត្វត្រូវការដកដង្ហើម?
  question_eng: What gas do plants release during photosynthesis that humans and animals need to breathe?
  input_format: mcq
  options:
  - អុកស៊ីសែន (Oxygen)
  - កាបូនិច (Carbon Dioxide)
  - អាសូត (Nitrogen)
  correct_answer: អុកស៊ីសែន (Oxygen)
  hint1:
    khmer: យើងត្រូវការឧស្ម័ននេះជារៀងរាល់វិនាទីដើម្បីរស់។
    eng: We need this gas every second to stay alive.
  hint2:
    khmer: រុក្ខជាតិបញ្ចេញ "អុកស៊ីសែន" (Oxygen)!
    eng: Plants produce "Oxygen" for us to breathe!
  hint3:
    title_khmer: ឧស្ម័នជីវិត
    title_eng: Gas of Life
    example_khmer: រស្មីសំយោគ → បញ្ចេញ អុកស៊ីសែន
    example_eng: Photosynthesis → Releases Oxygen
  explain_differently:
    simple_khmer: រុក្ខជាតិស្រូបយកកាបូនិច ហើយបញ្ចេញអុកស៊ីសែនស្អាតមកវិញ។
    simple_eng: Plants take in carbon dioxide and release fresh oxygen into the air.
    analogy_title: តម្រងខ្យល់ (Air Cleaner)
    analogy_khmer: ដើមឈើជាតម្រងខ្យល់ធម្មជាតិ។
    analogy_eng: Trees act as natural air purifiers.
    analogy_type: plants
