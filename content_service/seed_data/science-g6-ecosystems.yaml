id: science-g6-ecosystems
title_khmer: វិទ្យាសាស្ត្រ៖ ប្រព័ន្ធអេកូឡូស៊ី និងខ្សែច្រវាក់អាហារ
title_eng: 'Science: Ecosystems and Food Chains'
grade: 6
subject: science
problem_statement_khmer: នៅក្នុងប្រព័ន្ធអេកូឡូស៊ីវាលស្រែមួយ មានខ្សែច្រវាក់អាហារដូចជា៖ ស្រូវ → កណ្តូប → កង្កែប → ពស់។ តើសារពាង្គកាយណាជា "អ្នកផលិត" (Producer) ហើយតើសារពាង្គកាយណាជា "អ្នកប្រើប្រាស់បឋម" (Primary Consumer)?
problem_statement_eng: 'In a paddy field ecosystem, there is a food chain: Rice plant → Grasshopper → Frog → Snake. Which organism is the "Producer", and which is the "Primary Consumer"?'
image_uri: https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop&q=80
steps:
- id: eco-step-1
  step_number: 1
  total_steps: 2
  question_khmer: នៅក្នុងខ្សែច្រវាក់អាហារនេះ (ស្រូវ → កណ្តូប → កង្កែប → ពស់) តើសារពាង្គកាយណាជា "អ្នកផលិត" (Producer) ដែលបង្កើតអាហារដោយខ្លួនឯងតាមរស្មីសំយោគ?
  question_eng: 'In this food chain (Rice plant → Grasshopper → Frog → Snake), which organism is the "Producer" that makes its own food through photosynthesis?'
  input_format: mcq
  options:
  - ដើមស្រូវ (Rice plant)
  - សត្វកណ្តូប (Grasshopper)
  - សត្វកង្កែប (Frog)
  - សត្វពស់ (Snake)
  correct_answer: ដើមស្រូវ (Rice plant)
  hint1:
    khmer: អ្នកផលិត គឺជារុក្ខជាតិបៃតងដែលចាប់យកពន្លឺព្រះអាទិត្យដើម្បីបង្កើតអាហារ។
    eng: Producers are green plants that capture sunlight energy to produce food.
  hint2:
    khmer: នៅក្នុងខ្សែច្រវាក់អាហារ ដើមស្រូវគឺជារុក្ខជាតិដំបូងគេដែលផលិតថាមពល!
    eng: In this food chain, the rice plant is the green plant at the base that produces energy!
  hint3:
    title_khmer: និយមន័យអ្នកផលិត
    title_eng: Producer Definition
    example_khmer: ស្មៅ ស្រូវ និងដើមឈើ សុទ្ធតែជាអ្នកផលិត (Producers) ព្រោះវាធ្វើរស្មីសំយោគ។
    example_eng: Grass, rice, and trees are all Producers because they perform photosynthesis.
  explain_differently:
    simple_khmer: អ្នកផលិត គឺជារុក្ខជាតិដែលបង្កើតអាហារផ្ទាល់ខ្លួនពីពន្លឺព្រះអាទិត្យ ដោយមិនចាំបាច់ស៊ីសារពាង្គកាយដទៃ។
    simple_eng: Producers are plants that manufacture their own food using sunlight without eating other organisms.
    analogy_title: រោងចក្រអាហារធម្មជាតិ (Nature's Food Factory)
    analogy_khmer: ដូចជារោងចក្រដែលស្រូបពន្លឺព្រះអាទិត្យ និងទឹកដើម្បីផលិតអាហារសម្រាប់សត្វដទៃ!
    analogy_eng: Like a solar-powered factory using sunlight and water to produce food for the ecosystem!
    analogy_type: plants
- id: eco-step-2
  step_number: 2
  total_steps: 2
  question_khmer: តើសត្វណាជា "អ្នកប្រើប្រាស់បឋម" (Primary Consumer) ដែលស៊ីអ្នកផលិត (ដើមស្រូវ) ជាអាហារ?
  question_eng: 'Which animal is the "Primary Consumer" (Herbivore) that eats the producer (Rice plant)?'
  input_format: mcq
  options:
  - សត្វកណ្តូប (Grasshopper)
  - សត្វកង្កែប (Frog)
  - សត្វពស់ (Snake)
  - សត្វឥន្ទ្រី (Eagle)
  correct_answer: សត្វកណ្តូប (Grasshopper)
  hint1:
    khmer: អ្នកប្រើប្រាស់បឋម គឺជាសត្វស៊ីរុក្ខជាតិ (Herbivore) ដែលស៊ីអ្នកផលិតផ្ទាល់។
    eng: Primary consumers are herbivores that feed directly on producers.
  hint2:
    khmer: 'មើលព្រួញបន្ទាប់ពីដើមស្រូវ៖ ស្រូវ → កណ្តូប (កណ្តូបស៊ីដើមស្រូវ)!'
    eng: 'Look at the arrow after the rice plant: Rice plant → Grasshopper (grasshopper eats rice)!'
  hint3:
    title_khmer: កម្រិតខ្សែច្រវាក់អាហារ
    title_eng: Food Chain Levels
    example_khmer: ស្មៅ (អ្នកផលិត) → ទន្សាយ (អ្នកប្រើប្រាស់បឋម) → ចចក (អ្នកប្រើប្រាស់ទុតិយភូមិ)
    example_eng: Grass (Producer) → Rabbit (Primary Consumer) → Wolf (Secondary Consumer)
  explain_differently:
    simple_khmer: កណ្តូបស៊ីស្លឹកស្រូវជាអាហារ ដូច្នេះកណ្តូបគឺជាអ្នកប្រើប្រាស់លំដាប់ទី១ (បឋម)។
    simple_eng: The grasshopper feeds on rice leaves, making it the first-level (primary) consumer.
    analogy_title: អ្នកបរិភោគបឋម (First Diner)
    analogy_khmer: កណ្តូបគឺជាអតិថិជនទីមួយដែលមកទទួលទានអាហារពីរោងចក្ររុក្ខជាតិ!
    analogy_eng: The grasshopper is the first customer eating directly from the plant factory!
    analogy_type: plants
