# Dev-only overrides (compose merges this automatically).
# Publishes the backing stores on loopback so services run from the venv
# (uvicorn on localhost) can reach them. Production keeps them internal.
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
